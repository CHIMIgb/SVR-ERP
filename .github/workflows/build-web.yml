# Build del web para despliegue en Railway.
# Los runners de Railway del plan gratis (1 GB) no alcanzan para `next build`
# de este monorepo (se comprueba: Turbopack y Webpack mueren sin memoria).
# Los runners de GitHub tienen 7 GB — aquí se construye la imagen y se sube a
# GHCR; Railway la despliega con "Deploy from image".
# NOTA: al cambiar el workflow/paths, Railway NO redespliega solo — pulsar
# "Redeploy" en el servicio Web (o usar un Deploy Trigger, pendiente).

name: build-web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Las NEXT_PUBLIC_* se hornean en build time (van dentro del bundle del
      # navegador). No son secretas: son URLs públicas.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chimigb/svr-erp-web:latest
            ghcr.io/chimigb/svr-erp-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://svr-erp.up.railway.app/api
            NEXT_PUBLIC_APP_URL=https://svr-erp-web.up.railway.app
            NEXT_PUBLIC_TZ=America/Mexico_City
          cache-from: type=gha
          cache-to: type=gha,mode=max
