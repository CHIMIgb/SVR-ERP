# Build del web para despliegue en Railway.
# Los runners de Railway del plan gratis (1 GB) no alcanzan para `next build`
# de este monorepo (se comprueba: Turbopack y Webpack mueren sin memoria).
# Los runners de GitHub tienen 7 GB — aquí se construye la imagen y se sube a
# GHCR; Railway la despliega con "Deploy from image".
# El redeploy se dispara solo: requiere el secreto RAILWAY_TOKEN (project token)
# y, opcionalmente, la variable RAILWAY_SERVICE (por defecto "Web").
# El servicio debe apuntar al tag mutable :latest; con un tag por SHA el
# redeploy repite la imagen antigua.

name: build-web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Las NEXT_PUBLIC_* se hornean en build time (van dentro del bundle del
      # navegador). No son secretas: son URLs públicas.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chimigb/svr-erp-web:latest
            ghcr.io/chimigb/svr-erp-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://svr-erp.up.railway.app/api
            NEXT_PUBLIC_APP_URL=https://svr-prod.up.railway.app
            NEXT_PUBLIC_TZ=America/Mexico_City
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Railway no redepliega solo al actualizarse la imagen: el redeploy vuelve a
  # jalar el tag :latest y recoge el digest nuevo.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy del servicio Web en Railway
        run: npx -y @railway/cli@latest redeploy --service "${{ vars.RAILWAY_SERVICE || 'Web' }}" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
