# Build del web para despliegue en Railway.
# Los runners de Railway del plan gratis (1 GB) no alcanzan para `next build`
# de este monorepo (se comprueba: Turbopack y Webpack mueren sin memoria).
# Los runners de GitHub tienen 7 GB — aquí se construye la imagen y se sube a
# GHCR; Railway la despliega con "Deploy from image".
# NOTA: al cambiar el workflow/paths, Railway NO redespliega solo — pulsar
# "Redeploy" en el servicio Web (o usar un Deploy Trigger, pendiente).

name: build-web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Las NEXT_PUBLIC_* se hornean en build time (van dentro del bundle del
      # navegador). No son secretas: son URLs públicas.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chimigb/svr-erp-web:latest
            ghcr.io/chimigb/svr-erp-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://svr-erp.up.railway.app/api
            NEXT_PUBLIC_APP_URL=https://svr-prod.up.railway.app
            NEXT_PUBLIC_TZ=America/Mexico_City
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La imagen ya está publicada cuando corre esto: avisa de un contenedor
      # que no arranca, pero no impide publicarla. Cambiar el orden exige
      # build local → smoke → push (más cambio del que vale hoy).
      - name: Smoke del contenedor
        run: |
          docker run -d --name svr-web -p 3000:3000 ghcr.io/chimigb/svr-erp-web:latest
          for i in $(seq 1 20); do
            if curl -fsSL http://127.0.0.1:3000/ > /dev/null; then
              echo "Contenedor respondiendo en el puerto 3000"
              docker logs svr-web
              docker rm -f svr-web
              exit 0
            fi
            sleep 3
          done
          echo "El contenedor no respondió en 60s"
          docker logs svr-web
          docker rm -f svr-web
          exit 1
